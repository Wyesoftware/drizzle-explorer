<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- Drizzle Explorer app icon: a database cylinder under light rain, on the macOS icon grid (824px rounded square). -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1e3a5f"/>
      <stop offset="1" stop-color="#0e7490"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.3" cy="0.2" r="0.9">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="body" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f8fafc"/>
      <stop offset="0.55" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#dbeafe"/>
    </linearGradient>
    <linearGradient id="drop" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#bae6fd"/>
      <stop offset="1" stop-color="#38bdf8"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#000000" flood-opacity="0.28"/>
    </filter>
  </defs>

  <rect x="100" y="100" width="824" height="824" rx="186" fill="url(#bg)"/>
  <rect x="100" y="100" width="824" height="824" rx="186" fill="url(#glow)"/>

  <!-- rain drops -->
  <g fill="url(#drop)" opacity="0.95">
    <path transform="translate(330 262) scale(1.15)" d="M0,-30 C13,-11 23,3 23,14 A23,23 0 1,1 -23,14 C-23,3 -13,-11 0,-30 Z"/>
    <path transform="translate(452 214) scale(0.85)" d="M0,-30 C13,-11 23,3 23,14 A23,23 0 1,1 -23,14 C-23,3 -13,-11 0,-30 Z"/>
    <path transform="translate(558 286) scale(1.0)" d="M0,-30 C13,-11 23,3 23,14 A23,23 0 1,1 -23,14 C-23,3 -13,-11 0,-30 Z"/>
    <path transform="translate(672 226) scale(0.75)" d="M0,-30 C13,-11 23,3 23,14 A23,23 0 1,1 -23,14 C-23,3 -13,-11 0,-30 Z"/>
  </g>

  <!-- database cylinder -->
  <g filter="url(#shadow)">
    <path d="M322,430 L322,700 A190,62 0 0 0 702,700 L702,430 Z" fill="url(#body)"/>
    <ellipse cx="512" cy="430" rx="190" ry="62" fill="#e0f2fe"/>
    <ellipse cx="512" cy="430" rx="190" ry="62" fill="none" stroke="#0e7490" stroke-opacity="0.35" stroke-width="8"/>
  </g>
  <!-- disc separators (lower arcs) -->
  <g fill="none" stroke="#0e7490" stroke-opacity="0.45" stroke-width="12">
    <path d="M322,520 A190,62 0 0 0 702,520"/>
    <path d="M322,610 A190,62 0 0 0 702,610"/>
  </g>
</svg>
